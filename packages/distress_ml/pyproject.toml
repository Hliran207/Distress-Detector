[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distress-ml"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "nltk==3.8.1",
]

[project.optional-dependencies]
inference = [
  "torch>=2.6.0",
  "transformers==4.41.0",
  "scikit-learn==1.6.1",
  "joblib==1.4.2",
  "huggingface_hub==0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["distress_ml*"]
